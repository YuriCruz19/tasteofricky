<title>tasteofricky</title>

<style>
  :root{
    --bg:#0d0d0d;
    --card:#171717;
    --card-hover:#1e1e1e;
    --border:#2a2a2a;
    --red:#a855f7;
    --text:#ffffff;
    --muted:#9a9a9a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%}
  body{
    font-family:'Poppins',system-ui,sans-serif;
    color:var(--text);
    background:
      radial-gradient(ellipse 90% 45% at 50% 0%, rgba(88,28,135,.55), transparent 70%),
      radial-gradient(ellipse 60% 40% at 100% 100%, rgba(70,20,110,.35), transparent 70%),
      var(--bg);
    background-attachment:fixed;
    display:flex;justify-content:center;
    padding:56px 18px 40px;
  }
  main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center}

  /* Avatar */
  .avatar{position:relative;width:108px;height:108px;margin-bottom:22px}
  .avatar img{
    width:100%;height:100%;object-fit:cover;border-radius:50%;
    border:3px solid var(--red);
    box-shadow:0 0 22px rgba(168,85,247,.55), 0 0 0 4px #111 inset;
    background:#222;
  }
  .avatar .online{
    position:absolute;right:4px;bottom:6px;width:16px;height:16px;border-radius:50%;
    background:#22c55e;border:3px solid #111;box-shadow:0 0 8px rgba(34,197,94,.8);
  }

  h1{
    font-family:'Anton',Impact,sans-serif;font-weight:400;
    font-size:38px;letter-spacing:2px;text-transform:uppercase;text-align:center;
    text-shadow:0 0 18px rgba(192,132,252,.35);
  }
  .subtitle{
    margin-top:8px;font-size:12px;letter-spacing:2.5px;text-transform:uppercase;
    color:var(--muted);text-align:center;
  }
  .divider{
    width:44px;height:2px;margin:36px 0 34px;border-radius:2px;
    background:linear-gradient(90deg,transparent,var(--red),transparent);
    box-shadow:0 0 8px var(--red);
  }

  /* Cards */
  .links{width:100%;display:flex;flex-direction:column;gap:14px}
  .card{
    display:flex;align-items:center;gap:14px;
    padding:18px 18px;border-radius:16px;
    background:var(--card);border:1px solid var(--border);
    color:inherit;text-decoration:none;
    transition:transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .card:hover{transform:translateY(-2px);background:var(--card-hover);border-color:#3a3a3a}
  .card:active{transform:scale(.99)}
  .icon{
    width:52px;height:52px;flex-shrink:0;border-radius:12px;overflow:hidden;
    display:grid;place-items:center;font-family:'Anton',sans-serif;font-size:24px;
  }
  .icon img{width:100%;height:100%;object-fit:cover}
  .info{flex:1;min-width:0}
  .title{font-family:'Anton',sans-serif;font-size:17px;letter-spacing:1px;text-transform:uppercase}
  .desc{font-size:13px;color:var(--muted);margin:2px 0 8px;line-height:1.35}
  .badge{
    display:inline-flex;align-items:center;gap:5px;
    font-size:10px;font-weight:600;letter-spacing:1.2px;text-transform:uppercase;
    padding:3px 10px;border-radius:999px;border:1px solid currentColor;
  }
  .chev{color:#555;font-size:20px;padding-left:4px}

  footer{margin-top:48px;font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#444}

  @media (max-width:380px){ h1{font-size:32px} .desc{font-size:12px} }
</style>
</head>

  <h1 id="nome"></h1>
  <p class="subtitle" id="subtitulo"></p>
  <div class="divider"></div>

  <nav class="links" id="links"></nav>

  <footer id="rodape"></footer>
</main>

const lista = document.getElementById("links");
LINKS.forEach(l => {
  const a = document.createElement("a");
  a.className = "card";
  a.href = l.url;
  a.target = "_blank";
  a.rel = "noopener";

  const icon = document.createElement("div");
  icon.className = "icon";
  const fallback = () => {
    icon.innerHTML = "";
    icon.style.background = l.corIcone;
    icon.textContent = l.titulo.charAt(0).toUpperCase();
  };
  if (l.icone) {
    const img = document.createElement("img");
    img.src = l.icone; img.alt = l.titulo;
    img.onerror = fallback;
    icon.appendChild(img);
  } else fallback();

  const info = document.createElement("div");
  info.className = "info";
  info.innerHTML = '<div class="title"></div><div class="desc"></div>';
  info.querySelector(".title").textContent = l.titulo;
  info.querySelector(".desc").textContent = l.descricao;
  if (l.selo) {
    const b = document.createElement("span");
    b.className = "badge";
    b.style.color = l.corSelo;
    b.style.background = l.corSelo + "14";
    b.textContent = l.selo;
    info.appendChild(b);
  }

  const chev = document.createElement("span");
  chev.className = "chev"; chev.textContent = "›";

  a.append(icon, info, chev);
  lista.appendChild(a);
});
</script>
</body>
</html>
